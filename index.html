const mq = q => (typeof window.matchMedia === 'function' ? window.matchMedia(q) : { matches:false });
const prefersReduced = () => mq('(prefers-reduced-motion: reduce)').matches;
const canHover = () => mq('(hover:hover)').matches;

/* localStorage is wrapped — some embedded contexts block it, and a saved list
   is never important enough to break the page over. */
const store = {
  get(k, fb){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ /* session-only */ } }
};
let saved = new Set(store.get('ghungroo:saved', []));
const isSaved = id => saved.has(id);
function toggleSaved(id){
  const p = byId(id); if (!p) return;
  if (saved.has(id)){ saved.delete(id); toast(p.name + ' removed from your list'); }
  else { saved.add(id); toast(p.name + ' saved. Send your list on WhatsApp any time.'); }
  store.set('ghungroo:saved', Array.from(saved));
  syncSaved();
}
function syncSaved(){
  const n = saved.size, badge = $('#savedCount');
  badge.textContent = n; badge.dataset.empty = n ? '0' : '1';
  const mb = $('#mbSavedCount'); if (mb){ mb.textContent = n; mb.dataset.empty = n ? '0' : '1'; }
  $$('[data-act="wish"]').forEach(b => {
    const on = isSaved(b.dataset.id);
    b.classList.toggle('is-on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    const txt = b.querySelector('.wish-txt');
    if (txt) txt.textContent = on ? 'Saved to your list' : 'Save this design';
    else b.setAttribute('aria-label', (on ? 'Remove ' : 'Save ') + b.dataset.name);
  });
}

/* cart — same no-backend pattern as the saved list: kept in this browser only,
   and "checkout" is sending the list to WhatsApp for price and availability. */
let cart = new Map(store.get('ghungroo:cart', []));
const cartQty = id => cart.get(id) || 0;
const cartCount = () => Array.from(cart.values()).reduce((n, q) => n + q, 0);
function saveCart(){ store.set('ghungroo:cart', Array.from(cart.entries())); }
function addToCart(id, qty = 1){
  const p = byId(id); if (!p || p.stock === 'out') return;
  cart.set(id, cartQty(id) + qty);
  saveCart(); syncCart();
  toast(p.name + ' added to cart');
}
function setCartQty(id, qty){
  const p = byId(id); if (!p) return;
  if (qty <= 0){ cart.delete(id); } else { cart.set(id, qty); }
  saveCart(); syncCart(); render();
}
function removeFromCart(id){
  const p = byId(id);
  cart.delete(id); saveCart(); syncCart(); render();
  if (p) toast(p.name + ' removed from cart');
}
function syncCart(){
  const n = cartCount(), badge = $('#cartCount');
  if (badge){ badge.textContent = n; badge.dataset.empty = n ? '0' : '1'; }
  const mbc = $('#mbCartCount'); if (mbc){ mbc.textContent = n; mbc.dataset.empty = n ? '0' : '1'; }
  $$('[data-act="add-cart"]').forEach(b => {
    const q = cartQty(b.dataset.id), on = q > 0;
    b.classList.toggle('is-on', on);
    const txt = b.querySelector('.cart-txt');
    if (txt) txt.textContent = on ? `In cart (${q}) · Add another` : 'Add to Cart';
  });
}
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('is-on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('is-on'), 3200);
}

/* ==========================================================================
   6b. LIVE OVERRIDES — read side only
   Every image on the site is resolved through img() or productImgSrc()
   below, so an override changes it everywhere that photo is used.
   Overrides live in the Supabase `image_overrides` table (see
   supabase_setup.sql) and are only ever READ here. All editing (uploads,
   add/delete products, collections, categories, reels, offers bar) now
   lives in the separate ghungroo-admin.html file.
   ========================================================================== */
let ADMIN = { photos:{}, products:{}, logo:null, links:{}, titles:{}, reelsAdded:[], reelsRemoved:[], collectionsAdded:[], collectionsRemoved:[], categoriesAdded:[], categoriesRemoved:[], announce:null };

/* ---------- offers bar (scrolling announcement strip) ----------
   Messages come from the admin panel (Site Admin → Offers Bar), stored as one
   'announce:config' row in Supabase. Until an admin saves something, the
   built-in CONTENT.announcement is shown. **double asterisks** = bold. */
const fmtAnnounce = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
function announceItems(){
  const a = ADMIN.announce;
  return (a && Array.isArray(a.items) && a.items.length) ? a.items : [CONTENT.announcement];
}
const announceSig = items => items.join('\u00a6');
function applyAnnouncement(){
  const bar = $('#announce'), box = $('#announceMarquee'), track = $('#announceTrack');
  if (!bar || !track) return;
  const items = announceItems();
  const on = !(ADMIN.announce && ADMIN.announce.on === false);
  bar.hidden = !on || store.get('ghungroo:announce', '') === announceSig(items);
  track.innerHTML = '';
  if (bar.hidden) return;
  const li = items.map(t => `<li>${fmtAnnounce(t)}</li>`).join('');
  track.innerHTML = `<ul class="announce-group">${li}</ul>`;
  const group = track.firstElementChild;
  /* few/short messages: repeat them (hidden from screen readers) until one
     loop is wider than the bar, so the marquee never shows a gap */
  for (let i = 0; i < 8 && group.offsetWidth < box.clientWidth; i++){
    group.insertAdjacentHTML('beforeend', li.replace(/<li>/g, '<li aria-hidden="true">'));
  }
  const clone = group.cloneNode(true);
  clone.setAttribute('aria-hidden', 'true');
  track.appendChild(clone);
  track.style.setProperty('--announce-dur', Math.max(14, group.offsetWidth / 55) + 's');
}
function unflattenOverrides(rows){
  const out = { photos:{}, products:{}, logo:null, links:{}, titles:{}, reelsAdded:[], reelsRemoved:[], collectionsAdded:[], collectionsRemoved:[], categoriesAdded:[], categoriesRemoved:[], announce:null };
  rows.forEach(({ key, url }) => {
    if (key === 'logo'){ out.logo = url; return; }
    if (key === 'announce:config'){ try{ out.announce = JSON.parse(url) || null; }catch(e){ out.announce = null; } return; }
    if (key === 'reels:added'){ try{ out.reelsAdded = JSON.parse(url) || []; }catch(e){ out.reelsAdded = []; } return; }
    if (key === 'reels:removed'){ try{ out.reelsRemoved = JSON.parse(url) || []; }catch(e){ out.reelsRemoved = []; } return; }
    if (key === 'collections:added'){ try{ out.collectionsAdded = JSON.parse(url) || []; }catch(e){ out.collectionsAdded = []; } return; }
    if (key === 'collections:removed'){ try{ out.collectionsRemoved = JSON.parse(url) || []; }catch(e){ out.collectionsRemoved = []; } return; }
    if (key === 'categories:added'){ try{ out.categoriesAdded = JSON.parse(url) || []; }catch(e){ out.categoriesAdded = []; } return; }
    if (key === 'categories:removed'){ try{ out.categoriesRemoved = JSON.parse(url) || []; }catch(e){ out.categoriesRemoved = []; } return; }
    if (key.startsWith('photo:')){ out.photos[key.slice(6)] = url; return; }
    if (key.startsWith('link:')){ out.links[key.slice(5)] = url; return; }
    if (key.startsWith('title:')){ out.titles[key.slice(6)] = url; return; }
    if (key.startsWith('product:')){
      const [, id, idx] = key.split(':');
      out.products[id] = out.products[id] || [null, null];
      out.products[id][idx] = url;
    }
  });
  return out;
}
/* resolves the URL a reel's Instagram button/share action should use — a
   saved admin override always wins, then a hardcoded `link` on the reel
   itself (CONTENT.instagram), and finally the general profile link so old
   reels without a specific link keep working exactly as before. */
function reelLink(r){
  return ADMIN.links[r.key] || r.link || BUSINESS.instagram;
}
/* the live list of reels — the hardcoded CONTENT.instagram reels, minus
   any the admin has deleted, plus any reels the admin has added from the
   admin panel, with any saved title override applied. This is what every
   part of the site (the public carousel, the admin tab, keyboard/click
   binding) should read instead of CONTENT.instagram directly, so an
   add/delete in the admin panel is reflected everywhere immediately. */
function effectiveReels(){
  const removed = new Set(ADMIN.reelsRemoved || []);
  const base = CONTENT.instagram.filter(r => !removed.has(r.key));
  const added = (ADMIN.reelsAdded || []).filter(r => !removed.has(r.key));
  return [...base, ...added].map(r => ({ ...r, title: ADMIN.titles[r.key] || r.title || '' }));
}
/* the subset actually shown to visitors — a freshly added custom reel
   stays out of the public carousel until the admin has uploaded a photo
   for it, so nobody sees a broken image while a reel is still being set up. */
function publicReels(){
  return effectiveReels().filter(r => !r.custom || !!ADMIN.photos[r.key]);
}
/* the live list of collections — the hardcoded COLLECTIONS, minus any the
   admin has deleted, plus any collections the admin has added from the
   admin panel. Every part of the site (shop filters, the collections
   pages, the mega menu, the add-product form, routing, the admin tab
   itself) reads this instead of COLLECTIONS directly, so an add/delete in
   the admin panel is reflected everywhere immediately. */
function effectiveCollections(){
  const removed = new Set(ADMIN.collectionsRemoved || []);
  const base = COLLECTIONS.filter(c => !removed.has(c.slug));
  const added = (ADMIN.collectionsAdded || []).filter(c => !removed.has(c.slug));
  return [...base, ...added];
}
/* the live list of categories — CATEGORIES, minus any the admin has
   deleted, plus any the admin has added. Mirrors effectiveCollections()
   exactly; every part of the site that lists categories (catalogue chips,
   the homepage grid, nav menus, the add-product form, the admin tab
   itself) reads this instead of CATEGORIES directly. */
function effectiveCategories(){
  const removed = new Set(ADMIN.categoriesRemoved || []);
  const base = CATEGORIES.filter(c => !removed.has(c.slug));
  const added = (ADMIN.categoriesAdded || []).filter(c => !removed.has(c.slug));
  return [...base, ...added];
}
/* a collection's tile/banner photo, the same way a custom reel's photo
   resolves — an admin override always wins, then a real PHOTOS default,
   and EMPTY_SLIDE_SRC (rather than a broken image) for a brand-new
   collection that hasn't had a photo uploaded for it yet. */
function collPhotoSrc(key, w = 900){
  return keyPhotoSrc(key, w) || EMPTY_SLIDE_SRC;
}
/* same resolution for a category tile photo. */
function catPhotoSrc(key, w = 900){
  return keyPhotoSrc(key, w) || EMPTY_SLIDE_SRC;
}
/* resolves what a reel/photo key should actually show as a preview —
   an admin override always wins, then a real PHOTOS default or a raw
   URL key, and null (no image at all yet) otherwise, e.g. a brand-new
   custom reel with no photo uploaded yet. */
function keyPhotoSrc(key, w = 900){
  if (ADMIN.photos[key]) return ADMIN.photos[key];
  if (PHOTOS[key] || /^https?:\/\//.test(key)) return img(key, w);
  return null;
}
/* tolerates a link pasted without "https://" (still a valid permalink,
   just not what <blockquote data-instgrm-permalink> or an <a href> want). */
function instagramPermalink(url){
  if (!url) return '';
  return /^https?:\/\//i.test(url) ? url : `https://${url.replace(/^\/+/, '')}`;
}
/* only a real post/reel permalink can be embedded — the general profile
   link (the fallback above) isn't, so this tells a reel slot whether to
   render the live Instagram embed or fall back to its curated photo. */
function isRealInstagramPost(url){
  return !!url && /instagram\.com\/(p|reel|reels|tv)\//i.test(url);
}
/* Instagram's embed widget (the same script behind its own "Embed" button
   on any public post) — loaded once, lazily, only when a page actually has
   a real embed to show. It doesn't watch the DOM itself, so every time we
   inject new/changed blockquotes we call instgrm.Embeds.process() again. */
let igEmbedPromise = null;
function ensureInstagramEmbedScript(){
  if (window.instgrm) return Promise.resolve(window.instgrm);
  if (igEmbedPromise) return igEmbedPromise;
  igEmbedPromise = new Promise(resolve => {
    const s = document.createElement('script');
    s.src = 'https://www.instagram.com/embed.js';
    s.async = true;
    s.onload = () => resolve(window.instgrm || null);
    s.onerror = () => resolve(null);
    document.body.appendChild(s);
  });
  return igEmbedPromise;
}
/* per-product image resolver — a product-level override always wins,
   otherwise it falls back to the shared photo key (and any admin override
   on that key) exactly like every other image on the site. */
function productImgSrc(p, idx, w){
  const ov = ADMIN.products[p.id];
  if (ov && ov[idx]) return ov[idx];
  const key = p.images && p.images[idx];
  return key ? img(key, w) : EMPTY_SLIDE_SRC;   // no photo yet — e.g. a product just added in the admin panel
}
function productPicture(p, idx, alt, ratio = 'r-4-5', w = 900, cls = '', loading = 'lazy', sizes = ''){
  return `<div class="frame ${ratio} ${cls}">
    <img ${imgAttrs(productImgSrc(p, idx, w), sizes || (w <= 200 ? '110px' : PIC_SIZES), w)} alt="${esc(alt)}" loading="${loading}" decoding="async">
  </div>`;
}
function applyLogoOverride(){
  $$('.brand-logo').forEach(el => { el.style.backgroundImage = ADMIN.logo ? `url("${ADMIN.logo}")` : ''; });
}
/* promo slider — resolves each slide's image the same way as every other
   photo (an admin override on `photo:<key>` always wins), except a slide
   with no default photo and no override simply isn't shown at all, instead
   of guessing at a broken image URL. */
const EMPTY_SLIDE_SRC = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200"><rect width="300" height="200" fill="#F1E7CC"/></svg>');
function promoSlideSrc(slide, w = 1600){
  const override = ADMIN.photos[slide.key];
  if (override) return override;
  if (slide.photo) return img(slide.photo, w);
  return null;
}
function promoSlidesData(){
  return CONTENT.promoSlides
    .map(s => ({ ...s, src: promoSlideSrc(s) }))
    .filter(s => s.src);
}

function picture(key, alt, ratio = 'r-4-5', w = 900, cls = '', loading = 'lazy', sizes = ''){
  return `<div class="frame ${ratio} ${cls}">
    <img ${imgAttrs(img(key, w), sizes || PIC_SIZES, w)} alt="${esc(alt)}" loading="${loading}" decoding="async">
  </div>`;
}

function productCard(p, opts = {}){
  const s = STOCK[p.stock];
  const flag = p.stock === 'out' ? '<span class="p-flag soldout">Unavailable</span>'
             : p.isNew ? '<span class="p-flag">New</span>'
             : p.stock === 'order' ? '<span class="p-flag">Made to order</span>' : '';
  return `<article class="p-card">
    <div class="p-media">
      ${flag}
      <a href="#/product/${p.id}" aria-label="View ${esc(p.name)}">

/* ---------------------------------------------------------------- CATALOGUE */
const PRICE_BANDS = [
  { id:'under-1000', label:'Under ₹1,000',     test:p => p.price !== null && p.price < 1000 },
  { id:'1000-2000',  label:'₹1,000 – ₹2,000',  test:p => p.price !== null && p.price >= 1000 && p.price <= 2000 },
  { id:'above-2000', label:'Above ₹2,000',     test:p => p.price !== null && p.price > 2000 },
  { id:'on-enquiry', label:'Price on enquiry',  test:p => p.price === null }
];
const SORTS = [
  { id:'featured',   label:'Featured' },
  { id:'new',        label:'New arrivals' },
  { id:'price-asc',  label:'Price: low to high' },
  { id:'price-desc', label:'Price: high to low' },
  { id:'name',       label:'Name: A to Z' }
];

function filterProducts(q){
  const text = (q.q || '').trim().toLowerCase();
  const colls = (q.coll || '').split(',').filter(Boolean);
  const avail = (q.avail || '').split(',').filter(Boolean);
  const bands = (q.price || '').split(',').filter(Boolean);
  let list = PRODUCTS.filter(p => {
    if (q.cat && q.cat !== 'all' && p.cat !== q.cat) return false;
    if (colls.length && !colls.includes(p.coll)) return false;
    if (avail.length && !avail.includes(p.stock)) return false;
    if (bands.length && !bands.some(b => (PRICE_BANDS.find(x => x.id === b) || {test:()=>false}).test(p))) return false;
    if (text){
      const hay = [p.name, catName(p.cat), collName(p.coll), p.desc, p.tags.join(' ')].join(' ').toLowerCase();
      if (!hay.includes(text)) return false;
    }
    return true;
  });
  const sort = q.sort || 'featured';
  const rank = { in:0, order:1, out:2 };
  list.sort((a, b) => {
    if (sort === 'new')        return (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0) || a.name.localeCompare(b.name);
    if (sort === 'price-asc')  return (a.price ?? 1e9) - (b.price ?? 1e9);
    if (sort === 'price-desc') return (b.price ?? -1) - (a.price ?? -1);
    if (sort === 'name')       return a.name.localeCompare(b.name);
    return (b.featured ? 1 : 0) - (a.featured ? 1 : 0) || rank[a.stock] - rank[b.stock] || a.name.localeCompare(b.name);
  });
  return list;
}

function activeTags(q){
  const tags = [];
  if (q.q) tags.push({ label:`“${q.q}”`, patch:{ q:null } });
  if (q.cat && q.cat !== 'all') tags.push({ label:catName(q.cat), patch:{ cat:null } });
  (q.coll || '').split(',').filter(Boolean).forEach(c =>
    tags.push({ label:collName(c), patch:{ coll:(q.coll.split(',').filter(x => x !== c).join(',')) || null } }));
  (q.avail || '').split(',').filter(Boolean).forEach(a =>
    tags.push({ label:STOCK[a].label, patch:{ avail:(q.avail.split(',').filter(x => x !== a).join(',')) || null } }));
  (q.price || '').split(',').filter(Boolean).forEach(b =>
    tags.push({ label:(PRICE_BANDS.find(x => x.id === b) || {}).label || b, patch:{ price:(q.price.split(',').filter(x => x !== b).join(',')) || null } }));
  return tags;
}

  <div class="cat-toolbar">

function buildChrome(){
  applyAnnouncement();
  /* the QR code is the single most expensive thing on the page to build and sits at the very bottom —
     draw it once the browser is idle, into its fixed-size box */
  (window.requestIdleCallback || (f => setTimeout(f, 250)))(() => {
    const box = $('.foot-qr[data-qr]');
    if (!box || box.querySelector('svg')) return;
    const svg = makeQr();
    if (svg) box.insertAdjacentHTML('afterbegin', svg); else box.remove();
  }, { timeout:2500 });
  $('#headWa').href = waLink('general');
  $('#waFab').href = waLink('general');
  $('#drawerWa').href = waLink('general');
  $('#drawerCall').href = telLink();

  /* category strip */
  $('#catBarList').innerHTML = [
    `<li><a href="#/catalogue">All Jewellery</a></li>`,
    ...effectiveCategories().map(c => `<li><a href="#/catalogue?cat=${c.slug}">${c.name}</a></li>`),
    `<li><a href="#/collection/bridal">Bridal</a></li>`,
    `<li><a href="#/collection/everyday-elegance">Daily Wear</a></li>`,
    `<li><a href="#/collection/festive-edit">Festive</a></li>`
  ].join('');

  /* mega — jewellery */
  $('#megaJewellery').innerHTML = `<div class="wrap mega-inner">
    <div>
      <h4>Shop by category</h4>

/* ==========================================================================
   12. ROUTER
   ========================================================================== */
function parseHash(){
  const raw = location.hash.replace(/^#/, '') || '/';
  const [path, qs] = raw.split('?');
  const q = {};
  new URLSearchParams(qs || '').forEach((v, k) => { q[k] = v; });
  return { path: path || '/', q, parts: path.split('/').filter(Boolean) };
}
function qHref(q, patch){
  const merged = Object.assign({}, q, patch);
  Object.keys(merged).forEach(k => { if (merged[k] === null || merged[k] === undefined || merged[k] === '') delete merged[k]; });
  const s = new URLSearchParams(merged).toString();
  return '#/catalogue' + (s ? '?' + s : '');
}
const TITLES = {
  '/':'Ghungroo Creations — Anti-Tarnish Jewellery, Feels Like Real Gold',
  '/catalogue':'All Jewellery — Ghungroo Creations',
  '/collections':'Collections — Ghungroo Creations',
  '/bridal':'Bridal Jewellery — Ghungroo Creations',
  '/about':'About Us — Ghungroo Creations',
  '/contact':'Contact & Store — Ghungroo Creations',
  '/faq':'FAQs — Ghungroo Creations',
  '/saved':'Saved Designs — Ghungroo Creations',
  '/cart':'Your Cart — Ghungroo Creations',
  '/privacy':'Privacy — Ghungroo Creations',
  '/terms':'Terms — Ghungroo Creations'
};
let lastPath = null;

let rendered = false;
function render(soft){
  rendered = true;
  const { path, q, parts } = parseHash();
  const main = $('#main');
  let html, title = TITLES[path] || 'Ghungroo Creations';

  if (path === '/' || path === '') html = pageHome();
  else if (path === '/catalogue') html = pageCatalogue(q);
  else if (parts[0] === 'product'){
    const p = byId(parts[1]); html = pageProduct(parts[1]);
    title = p ? `${p.name} — ${catName(p.cat)} — Ghungroo Creations` : 'Not found — Ghungroo Creations';
  }
  else if (path === '/collections') html = pageCollections();
  else if (parts[0] === 'collection'){
    const c = effectiveCollections().find(x => x.slug === parts[1]);
    html = pageCollection(parts[1]);
    title = c ? `${c.name} — Ghungroo Creations` : 'Not found — Ghungroo Creations';
  }
  else if (path === '/bridal')   html = pageBridal();
  else if (path === '/about')    html = pageAbout();
  else if (path === '/contact')  html = pageContact();
  else if (path === '/faq')      html = pageFaq();
  else if (path === '/saved')    html = pageSaved();
  else if (path === '/cart')     html = pageCart();
  else if (path === '/privacy')  html = pageLegal('privacy');
  else if (path === '/terms')    html = pageLegal('terms');
  else { html = pageNotFound(); title = 'Page not found — Ghungroo Creations'; }

  /* jump to the top BEFORE swapping the content, instantly (the page has CSS smooth scrolling, which
     would otherwise animate a long scroll on every navigation) — and before the new DOM exists, so it
     doesn't force a synchronous layout of the whole new page */
  const keepScroll = soft || (lastPath === '/catalogue' && path === '/catalogue');
  lastPath = path;
  if (!keepScroll) window.scrollTo({ top:0, behavior:'instant' });

  main.innerHTML = html;
  document.title = title;

  /* nav state */
  $$('#headNav a').forEach(a => {
    const href = a.getAttribute('href');
    a.removeAttribute('aria-current');
    if (href === '#' + path) a.setAttribute('aria-current', 'page');
  });

  /* dock state */
  $$('#mobileBar .mb-item[data-mb]').forEach(a => {
    const on = a.dataset.mb === (path === '' ? '/' : path);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });

  afterRender(path);
}

function afterRender(path){
  syncSaved();
  syncCart();
  initReveal();
  clearInterval(promoTimer);
  if ($('#faqpanel')) { renderFaqList(CONTENT.faq[0].id, ''); bindFaq(); }
  if (path === '/catalogue') bindCatalogue();
  if (path.startsWith('/product')) bindGallery();
  if (path === '/contact') bindContactForm();
  if (path === '/' || path === '') bindPromoSlider();
  bindReels();
  requestAnimationFrame(() => $$('.rail').forEach(updateRailButtons));
}

/* reveal-on-scroll — one observer per render */
let io;
function initReveal(){
  if (io) io.disconnect();
  const items = $$('[data-reveal]');
  if (prefersReduced() || !('IntersectionObserver' in window)){
    items.forEach(el => el.classList.add('is-in')); return;
  }
  io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting){ e.target.classList.add('is-in'); io.unobserve(e.target); } });
  }, { rootMargin:'0px 0px -8% 0px', threshold:.06 });
  items.forEach(el => io.observe(el));
}

/* promo slider — peek carousel: autoplay + dots + arrows + swipe. Two clones
   of the slides are added on each end so the loop is seamless in both
   directions (after a move lands on a clone we snap, with no animation, to
   the identical real slide). Re-bound on every render of the homepage; the
   previous interval is always cleared first (in afterRender), so navigating
   away never leaves a timer running against detached DOM. */
let promoTimer = null;
function bindPromoSlider(){
  const root = $('#promo');
  if (!root) return;
  const track = $('.promo-track', root);
  const real = $$('.promo-slide', root);
  const n = real.length;
  if (n < 2) return;
  const dots = $$('.promo-dot', root);
  const C = 2;                       /* clones on each side */

  const clone = src => {
    const c = src.cloneNode(true);
    c.classList.remove('is-active');
    c.removeAttribute('id');
    c.setAttribute('aria-hidden', 'true');
    c.tabIndex = -1;
    return c;
  };
  for (let k = 0; k < C; k++) track.insertBefore(clone(real[((n - C + k) % n + n) % n]), real[0]);
  for (let k = 0; k < C; k++) track.appendChild(clone(real[k % n]));

  const items = Array.from(track.children);
  let e = C;                         /* index (among items) of the active slide */
  let busy = false, settleT = 0;

  const setPos = animate => {
    if (!animate) track.classList.add('is-snapping');
    track.style.setProperty('--i', e);
    if (!animate){ void track.offsetWidth; track.classList.remove('is-snapping'); }
  };
  const paint = () => {
    const cur = ((e - C) % n + n) % n;
    items.forEach((s, k) => s.classList.toggle('is-active', k === e));
    [e - 1, e, e + 1].forEach(k => hydrateImg(items[k]));
    dots.forEach((d, k) => { d.classList.toggle('is-active', k === cur); d.setAttribute('aria-selected', String(k === cur)); });
  };
  const settle = () => {
    if (e < C) e += n; else if (e >= C + n) e -= n;
    setPos(false); paint();
    busy = false;
  };
  const restart = () => {
    clearInterval(promoTimer);
    if (!prefersReduced()) promoTimer = setInterval(() => go(e + 1), 5500);
  };
  const go = (t, user) => {
    if (busy) return;
    busy = true;
    e = t;
    const still = prefersReduced();
    setPos(!still); paint();
    clearTimeout(settleT);
    if (still) settle(); else settleT = setTimeout(settle, 800);
    if (user) restart();
  };

  /* initial position: suppress the transition for the first frames instead of forcing a synchronous
     layout of the whole page (void offsetWidth) — that reflow alone cost more than everything else here */
  track.classList.add('is-snapping'); track.style.setProperty('--i', e); paint();
  requestAnimationFrame(() => requestAnimationFrame(() => track.classList.remove('is-snapping')));

  $$('.promo-arrow[data-dir]', root).forEach(b => b.addEventListener('click', () => go(e + Number(b.dataset.dir), true)));
  dots.forEach((d, k) => d.addEventListener('click', () => go(C + k, true)));

  /* clicking the peeking edge of the neighbouring banner slides to it
     instead of following its link */
  track.addEventListener('click', ev => {
    const a = ev.target.closest('.promo-slide');
    if (!a) return;
    const k = items.indexOf(a);
    if (k !== e){ ev.preventDefault(); go(k > e ? e + 1 : e - 1, true); }
  });

  /* touch swipe */
  let sx = 0, sy = 0;
  track.addEventListener('touchstart', ev => { sx = ev.touches[0].clientX; sy = ev.touches[0].clientY; clearInterval(promoTimer); }, { passive:true });
  track.addEventListener('touchend', ev => {
    const dx = ev.changedTouches[0].clientX - sx, dy = ev.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3) go(e + (dx < 0 ? 1 : -1), true);
    else restart();
  }, { passive:true });

  root.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowLeft'){ go(e - 1, true); }
    else if (ev.key === 'ArrowRight'){ go(e + 1, true); }
  });
  root.addEventListener('mouseenter', () => clearInterval(promoTimer));
  root.addEventListener('mouseleave', restart);
  restart();
}

/* reels — coverflow carousel. Each card just carries data-o (its offset
   from the active card); CSS turns that into position, size and dimming.
   Offsets wrap around, so it loops forever. A card that has to jump across
   the loop is teleported while invisible and faded back in. */
/* the reel "expand" view — 'photo' zooms the curated image (used for any
   reel without a real Instagram link yet); 'embed' shows the actual live
   Instagram post/reel, full quality, in its own natural shape — used once
   a reel has a real link, since that shape doesn't fit the coverflow
   card's fixed 3:5 tile the way a photo does. */
function openReelLightbox(kind, payload, opener){
  let lb = $('#reelLb');
  if (!lb){
    lb = document.createElement('div');
    lb.id = 'reelLb'; lb.className = 'reel-lb';
    lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-modal', 'true'); lb.setAttribute('aria-label', 'Reel');
    lb.innerHTML = '<button type="button" class="reel-lb-x" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button><div class="reel-lb-media"></div>';
    document.body.appendChild(lb);
    const close = () => { lb.classList.remove('is-on'); document.documentElement.style.overflow = ''; if (lb._opener) lb._opener.focus(); };
    lb.addEventListener('click', close);
    document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && lb.classList.contains('is-on')) close(); });
  }
  lb._opener = opener || null;
  const media = lb.querySelector('.reel-lb-media');
  if (kind === 'embed'){
    media.innerHTML = `<blockquote class="instagram-media" data-instgrm-permalink="${esc(payload.permalink)}" data-instgrm-version="14" style="background:#FFF; border:0; border-radius:3px; box-shadow:0 0 1px 0 rgba(0,0,0,.5),0 1px 10px 0 rgba(0,0,0,.15); margin:0 auto; max-width:540px; min-width:326px; padding:0; width:100%;"></blockquote>`;
    ensureInstagramEmbedScript().then(instgrm => { if (instgrm) instgrm.Embeds.process(); });
  } else {
    media.innerHTML = '<img alt="">';
    const im = media.querySelector('img'); im.src = payload.src; im.alt = payload.alt || '';
  }
  lb.classList.add('is-on');
  document.documentElement.style.overflow = 'hidden';
  lb.querySelector('button').focus();
}

function bindReels(){
  const root = $('#reels');
  if (!root) return;
  const stage = $('.reels-stage', root);
  const cards = $$('.reel', root);
  const n = cards.length;
  if (!n) return;
  const dots = $$('.promo-dot', root);
  const R = 2;                                   /* reels visible each side */
  const lo = n >= 2 * R + 2 ? -(R + 1) : -Math.floor(n / 2);   /* wrap range — a spare hidden slot on the left when there's room */
  let idx = 0;
  let soundOn = false;                            /* shared across cards, like a real reels feed — unmute once, stays unmuted as you swipe */

  const applySoundIcon = card => {
    const btn = card.querySelector('[data-act="mute"]');
    if (!btn) return;
    btn.setAttribute('aria-pressed', String(soundOn));
    btn.setAttribute('aria-label', soundOn ? 'Mute' : 'Unmute');
    btn.innerHTML = soundOn ? ICON.volumeOn : ICON.volumeOff;
  };
  const offsetOf = i => ((((i - idx) - lo) % n) + n) % n + lo;
  const clamp = o => Math.max(-3, Math.min(3, o));
  const render = initial => {
    cards.forEach((c, i) => {
      const o = clamp(offsetOf(i));
      const prev = c.dataset.o === undefined ? null : Number(c.dataset.o);
      const wasActive = c.classList.contains('is-active');
      const jumped = !initial && prev !== null && Math.abs(o - prev) > 1;
      if (jumped){
        c.style.transition = 'none';
        if (Math.abs(o) < 3) c.style.opacity = '0';
      }
      c.dataset.o = String(o);
      c.classList.toggle('is-active', o === 0);
      c.setAttribute('aria-hidden', String(Math.abs(o) > R));
      if (jumped){
        void c.offsetWidth;
        c.style.transition = ''; c.style.opacity = '';
      }
      const vid = c.querySelector('.reel-video');
      if (vid){
        if (o === 0 && !prefersReduced()){ vid.muted = !soundOn; applySoundIcon(c); vid.play().catch(() => {}); }
        else if (wasActive){ vid.pause(); vid.currentTime = 0; }
      }
    });
    dots.forEach((d, i) => { d.classList.toggle('is-active', i === idx); d.setAttribute('aria-selected', String(i === idx)); });
  };
  const go = dir => { idx = (idx + dir + n) % n; render(false); };
  const goTo = i => { idx = i; render(false); };
  render(true);

  $$('.reels-arrow', root).forEach(b => b.addEventListener('click', () => go(Number(b.dataset.dir))));
  dots.forEach((d, i) => d.addEventListener('click', () => goTo(i)));

  stage.addEventListener('click', ev => {
    if (ev.target.closest('a.reel-btn')) return;       /* real links keep working */
    const card = ev.target.closest('.reel');
    if (!card) return;
    const i = Number(card.dataset.i);
    const act = ev.target.closest('[data-act]');
    if (card.classList.contains('is-active')){
      const r = publicReels()[i];
      if (act && act.dataset.act === 'share'){
        const url = reelLink(r), title = r.title || 'Ghungroo Creations';
        if (navigator.share){ navigator.share({ title, url }).catch(() => {}); }
        else if (navigator.clipboard){ navigator.clipboard.writeText(url).then(() => toast('Instagram link copied'), () => {}); }
        return;
      }
      if (act && act.dataset.act === 'mute'){
        soundOn = !soundOn;
        const vid = card.querySelector('.reel-video');
        if (vid) vid.muted = !soundOn;
        applySoundIcon(card);
        return;
      }
      /* "expand" (or tapping the active card itself) shows the real, live
         Instagram embed when this reel has a real post/reel link saved —
         its own natural shape gets room to breathe here, unlike the fixed
         3:5 coverflow tile — and otherwise just zooms the curated photo. */
      const permalink = instagramPermalink(reelLink(r));
      if (isRealInstagramPost(permalink)) openReelLightbox('embed', { permalink }, act || card);
      else openReelLightbox('photo', { src: img(card.dataset.key, 1400), alt: r.alt }, act || card);
    } else if (Math.abs(Number(card.dataset.o)) <= R){
      goTo(i);
    }
  });

  stage.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowLeft'){ ev.preventDefault(); go(-1); }
    else if (ev.key === 'ArrowRight'){ ev.preventDefault(); go(1); }
  });

  let sx = 0, sy = 0;
  stage.addEventListener('touchstart', ev => { sx = ev.touches[0].clientX; sy = ev.touches[0].clientY; }, { passive:true });
  stage.addEventListener('touchend', ev => {
    const dx = ev.changedTouches[0].clientX - sx, dy = ev.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.3) go(dx < 0 ? 1 : -1);
  }, { passive:true });
}

function bindGlobal(){
  document.addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    if (act){
      const kind = act.dataset.act;
      if (kind === 'wish'){ e.preventDefault(); toggleSaved(act.dataset.id); }
      if (kind === 'rail'){
        const r = document.getElementById(act.dataset.target);
        if (r) r.scrollBy({ left: Number(act.dataset.dir) * Math.max(240, r.clientWidth * .8), behavior: prefersReduced() ? 'auto' : 'smooth' });
      }
      if (kind === 'clear-saved'){
        saved.clear(); store.set('ghungroo:saved', []); syncSaved(); render(); toast('Saved list cleared');
      }
      if (kind === 'add-cart'){ e.preventDefault(); addToCart(act.dataset.id); }
      if (kind === 'cart-inc'){ setCartQty(act.dataset.id, cartQty(act.dataset.id) + 1); }
      if (kind === 'cart-dec'){ setCartQty(act.dataset.id, cartQty(act.dataset.id) - 1); }
      if (kind === 'cart-remove'){ removeFromCart(act.dataset.id); }
      if (kind === 'clear-cart'){ cart.clear(); saveCart(); syncCart(); render(); toast('Cart cleared'); }
    }
    const acc = e.target.closest('[data-acc]');
    if (acc){
      const panel = document.getElementById(acc.getAttribute('aria-controls'));
      const open = acc.getAttribute('aria-expanded') === 'true';
      acc.setAttribute('aria-expanded', String(!open));
      panel.classList.toggle('is-open', !open);
    }
    const sug = e.target.closest('[data-suggest]');
    if (sug){
      if (sug.dataset.go){ location.hash = sug.dataset.go; closeSearch(); return; }
      $('#searchInput').value = sug.dataset.suggest;
      renderSearch(sug.dataset.suggest);
    }
    if (e.target.closest('[data-close-search]')) closeSearch();
    if (e.target.closest('#drawer a')) closeDrawer();
  });

  $('#btnMenu').addEventListener('click', openDrawer);
  $('#drawerClose').addEventListener('click', closeDrawer);
  $('#btnSearch').addEventListener('click', openSearch);
  $('#searchClose').addEventListener('click', closeSearch);
  $('#scrim').addEventListener('click', () => { closeDrawer(); closeSearch(); });

  let st;
  $('#searchInput').addEventListener('input', e => {
    clearTimeout(st); const v = e.target.value;
    st = setTimeout(() => renderSearch(v), 130);
  });
  $('#searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.value.trim()){
      location.hash = '#/catalogue?q=' + encodeURIComponent(e.target.value.trim());
      closeSearch();
    }
  });

  const FOCUSABLE = 'a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])';
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ closeMega(); closeSearch(); closeDrawer(); }
    if (e.key === 'Tab'){
      const box = $('#drawer').classList.contains('is-open') ? $('#drawer')
                : $('#searchPanel').classList.contains('is-open') ? $('#searchPanel') : null;
      if (box){
        const items = $$(FOCUSABLE, box).filter(el => el.offsetParent !== null || el === document.activeElement);
        if (!items.length) return;
        const first = items[0], last = items[items.length - 1];
        if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
      }
    }
    if ((e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) && !/input|textarea|select/i.test(document.activeElement.tagName)){
      e.preventDefault(); openSearch();
    }
  });

  const railQ = new Set(); let railRaf = 0;
  document.addEventListener('scroll', e => {
    const r = e.target;
    if (!r.classList || !r.classList.contains('rail')) return;
    railQ.add(r);
    if (!railRaf) railRaf = requestAnimationFrame(() => { railRaf = 0; railQ.forEach(updateRailButtons); railQ.clear(); });
  }, { capture:true, passive:true });

  /* images that fail to load fall back to a designed surface, never a broken icon */
  document.addEventListener('error', e => {
    const el = e.target;
    /* a missing resized variant: retry once with the full-size file before giving up */
    if (el.tagName === 'IMG' && el.dataset.full && !el.dataset.retried){
      el.dataset.retried = '1'; el.removeAttribute('srcset'); el.removeAttribute('sizes'); el.src = el.dataset.full; return;
    }
    if (el.tagName === 'IMG' && !el.dataset.failed){
      el.dataset.failed = '1';
      el.style.opacity = '0';
      const holder = el.closest('.frame, .p-media, .stage, .hero-media, .hero-band, .thumb');
      if (holder) holder.classList.add('img-fallback');
    }
  }, true);

  window.addEventListener('hashchange', () => { closeMega(); closeSearch(); closeDrawer(); render(); });
}

/* ==========================================================================
   12. BOOT — data first, then one render
   The <head> script has already started the Supabase requests. Repeat visitors
   paint instantly from the copy saved on their last visit and refresh it quietly
   in the background; first-time visitors get a short head start (≤ 1.4 s) so the
   page paints ONCE with real data instead of the built-in catalogue followed by a
   second full re-render. If live data differs from what is on screen, the page
   updates in place without jumping back to the top.
   ========================================================================== */
const DATA_KEY = 'gh:data:v1';
function readDataCache(){
  try { const c = JSON.parse(localStorage.getItem(DATA_KEY) || 'null'); return c && Array.isArray(c.products) && Array.isArray(c.overrides) ? c : null; }
  catch(e){ return null; }
}
function writeDataCache(products, overrides){
  try { localStorage.setItem(DATA_KEY, JSON.stringify({ t:Date.now(), products, overrides })); } catch(e){ /* private mode — just skip caching */ }
}
/* true when the live state actually changed */
function applyData(prodRows, ovRows){
  let changed = false;
  if (Array.isArray(prodRows) && prodRows.length){
    const next = prodRows.map(mapProductRow);
    if (JSON.stringify(next) !== JSON.stringify(PRODUCTS)){ PRODUCTS = next; changed = true; }
  }
  if (Array.isArray(ovRows)){
    const next = unflattenOverrides(ovRows);
    if (JSON.stringify(next) !== JSON.stringify(ADMIN)){ ADMIN = next; changed = true; }
  }
  return changed;
}
/* re-render in place — but never wipe a form somebody is halfway through filling in */
function softRender(){
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest('#main')) return;
  render(true);
}

(function boot(){
  const gh = window.__GH || {};
  const cached = readDataCache();
  if (cached) applyData(cached.products, cached.overrides);

  buildChrome();
  applyLogoOverride();
  bindHeader();
  bindGlobal();

  const live = Promise.all([gh.products || null, gh.overrides || null]);
  const onLive = ([prodRows, ovRows]) => {
    if (!prodRows && !ovRows) return;                       // offline / Supabase down — keep what we have
    const changed = applyData(prodRows, ovRows);
    const base = cached || { products:[], overrides:[] };
    writeDataCache(Array.isArray(prodRows) && prodRows.length ? prodRows : base.products, Array.isArray(ovRows) ? ovRows : base.overrides);
    if (changed){
      applyLogoOverride();
      buildChrome();                                        // menus/footer list categories + collections
      if (rendered) softRender(); else render();
    }
  };

  if (cached){
    render();
    live.then(onLive);
  } else {
    let done = false;
    const first = res => { if (done) return; done = true; if (res) onLive(res); if (!rendered) render(); };
    live.then(res => { if (!done) first(res); else onLive(res); });
    setTimeout(() => first(null), 1400);                    // slow network: paint with built-in data, upgrade when it lands
  }
})();

</script>
</body>
